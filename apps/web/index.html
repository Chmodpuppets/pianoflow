<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="PianoFlow — open-source falling-notes piano practice (a Synthesia-style app)." />
    <title>PianoFlow</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">🎹 PianoFlow</div>
        <select id="songSelect" title="Bundled song"></select>
        <button id="loadBtn" title="Open a local .mid file">Open…</button>
        <input id="fileInput" type="file" accept=".mid,.midi,audio/midi" hidden />
        <button id="libraryBtn" title="Song library">📚 Songs</button>
        <button id="midiBtn" title="MIDI devices">🎛 MIDI</button>
        <button id="pluginsBtn" title="Plugins">🧩 Plugins</button>
        <button id="historyBtn" title="Practice history & progress">📈 History</button>
        <div class="spacer"></div>
        <button id="muteBtn" class="mute-btn" title="Mute / unmute all sound" aria-pressed="false" aria-label="Mute">🔊</button>
        <span id="soundStatus" class="badge">loading…</span>
        <span id="midiStatus" class="badge">MIDI: —</span>
      </header>

      <main id="stage">
        <canvas id="canvas"></canvas>
        <div id="hud">
          <div id="score">Hits 0/0 · Combo 0 · Acc 100%</div>
          <div id="judge" class="judge"></div>
        </div>
      </main>

      <footer id="controls">
        <button id="playBtn" class="primary">▶ Play</button>
        <button id="stopBtn" title="Stop and reset">■</button>
        <input id="seek" type="range" min="0" max="1000" value="0" title="Seek" />
        <span id="time" class="time">0:00 / 0:00</span>

        <label>Mode
          <select id="mode">
            <option value="listen" selected>Listen</option>
            <option value="practice">Practice</option>
          </select>
        </label>
        <label>Speed
          <select id="speed">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <label>Hands
          <select id="hands">
            <option value="both" selected>Both</option>
            <option value="right">Right</option>
            <option value="left">Left</option>
          </select>
        </label>
        <label class="chk"><input id="waitMode" type="checkbox" /> Wait</label>
        <label class="chk"><input id="labels" type="checkbox" /> Key labels</label>
        <label class="chk"><input id="noteLabels" type="checkbox" /> Note names</label>
        <label class="chk"><input id="colorblind" type="checkbox" /> Colorblind</label>
        <label class="chk"><input id="metronome" type="checkbox" /> Metronome</label>
        <label>Count-in
          <select id="countIn">
            <option value="0" selected>Off</option>
            <option value="1">1 beat</option>
            <option value="2">2 beats</option>
            <option value="4">4 beats</option>
          </select>
        </label>
        <span class="loopgroup">
          <label class="chk"><input id="loopEnabled" type="checkbox" /> Loop</label>
          <button id="loopA" title="Set loop start (A) at the current position">A</button>
          <button id="loopB" title="Set loop end (B) at the current position">B</button>
          <button id="loopClear" title="Clear the loop region">✕</button>
          <span id="loopReadout" class="time">A –:– · B –:–</span>
        </span>
      </footer>
    </div>

    <div id="library" class="drawer hidden" aria-label="Song library">
      <div class="drawer-head">
        <span>📚 Song library</span>
        <button id="libraryClose" title="Close">✕</button>
      </div>
      <div id="libraryList"></div>
    </div>

    <div id="midiPanel" class="drawer hidden" aria-label="MIDI devices">
      <div class="drawer-head">
        <span>🎛 MIDI devices</span>
        <button id="midiClose" title="Close">✕</button>
      </div>
      <div id="midiSupport" class="midi-support"></div>
      <div id="midiDeviceList"></div>
      <div class="midi-monitor">Last note: <span id="midiLastNote">—</span></div>
    </div>

    <div id="pluginsPanel" class="drawer hidden" aria-label="Plugins">
      <div class="drawer-head">
        <span>🧩 Plugins</span>
        <button id="pluginsClose" title="Close">✕</button>
      </div>
      <div class="plugins-hint">Extend PianoFlow with overlays and practice aids. Toggles are saved.</div>
      <div id="pluginsList"></div>
    </div>

    <div id="historyPanel" class="drawer hidden" aria-label="Practice history">
      <div class="drawer-head">
        <span>📈 Practice history</span>
        <button id="historyClose" title="Close">✕</button>
      </div>
      <div id="historySummary" class="history-summary"></div>
      <div id="historyList"></div>
      <div class="history-foot">
        <button id="historyClear" title="Delete all recorded sessions">Clear history</button>
      </div>
    </div>

    <div id="resultOverlay" class="overlay hidden">
      <div class="result-card">
        <div id="resultGrade" class="result-grade">S</div>
        <div id="resultTitle" class="result-title"></div>
        <div id="resultBest" class="result-best"></div>
        <div id="resultStats" class="result-stats"></div>
        <div class="result-actions">
          <button id="resultRetry" class="primary">↻ Retry</button>
          <button id="resultClose">Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
