name: Release

# Cross-platform desktop installers (macOS universal, Windows, Linux) built with
# tauri-action and attached to a single GitHub Release. Triggered by a version
# tag (v*) or manually. The release is created as a DRAFT so it can be verified
# before publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app and attach installers to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'PianoFlow v__VERSION__'
          releaseBody: |
            Open-source falling-notes piano practice — a libre Synthesia alternative.

            **Desktop installers** (this release): macOS (universal), Windows, Linux.
            **Web / PWA**: https://chmodpuppets.github.io/pianoflow/

            See the [README](https://github.com/Chmodpuppets/pianoflow#readme) for features and the [guide](https://github.com/Chmodpuppets/pianoflow/blob/main/docs/GUIDE.md) for controls.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
